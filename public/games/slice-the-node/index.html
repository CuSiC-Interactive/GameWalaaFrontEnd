    return l.node1.pos.y > 100 && l.node2.pos.y > 100;
  });
  maxY = 0;
  remove(nodes, (n) => {
    n.pos.y += scr;
    if (maxY < n.pos.y) {
      maxY = n.pos.y;
    }
    if (n.pos.y > fixedY) {
      if (n.color === "black") {
        n.color = "blue";
        checkRedNodes();
      }
      n.pos.add(n.vel);
      n.vel.y += 0.03;
      n.vel.mul(0.95);
    } else {
      n.vel.set();
    }
    color(n.color);
    box(n.pos, 5);
    if (n.pos.y > 100 && n.color === "red") {
      play("explosion");
      color("red");
      text("X", n.pos.x, 95);
      end();
    }
    if (n.pos.y > 140) {
      play("powerUp");
      addScore(multiplier, n.pos.x - 1, 99);
      if (multiplier < 64) {
        multiplier *= 2;
      }
      return true;
    }
  });
  if (input.isPressed) {
    checkRedNodes();
  }

  function checkRedNodes() {
    nodes.forEach((n) => {
      if (n.color === "red") {
        n.color = "blue";
      }
    });
    for (let i = 0; i < 9; i++) {
      let isAddingRed = false;
      lines.forEach((l) => {
        if (
          l.node1.color === "black" ||
          l.node1.color === "red" ||
          l.node2.color === "black" ||
          l.node2.color === "red"
        ) {
          if (l.node1.color === "blue") {
            l.node1.color = "red";
            isAddingRed = true;
          }
          if (l.node2.color === "blue") {
            l.node2.color = "red";
            isAddingRed = true;
          }
        }
      });
      if (!isAddingRed) {
        break;
      }
    }
  }
}
</script>
<script>window.addEventListener("load", onLoad);</script>
